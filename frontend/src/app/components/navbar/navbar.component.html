<nav class="navbar navbar-expand-md navbar-dark bg-primary">
  @if (!isInHomePage) {
    <a class="navbar-brand" routerLink="/">Home</a>
  }

  <button
    class="navbar-toggler"
    type="button"
    (click)="toggleNavbar()"
    aria-controls="navbarContent"
    [attr.aria-expanded]="!isNavbarCollapsed"
    aria-label="Toggle navigation"
  >
    <span class="navbar-toggler-icon"></span>
  </button>

  <div
    class="collapse navbar-collapse"
    [class.show]="!isNavbarCollapsed"
    id="navbarContent"
  >
    <ul class="navbar-nav mr-auto">
      <!-- Rock bands -->
      <li
        class="nav-item dropdown"
        (mouseenter)="onMouseEnter('rock')"
        (mouseleave)="onMouseLeave('rock')"
        (click)="onClick('rock')"
        [class.show]="rockOpen$ | async"
      >
        <a
          class="nav-link dropdown-toggle"
          style="cursor: pointer"
          [attr.aria-expanded]="rockOpen$ | async"
        >
          Rock bands
        </a>

        <div class="dropdown-menu" [class.show]="rockOpen$ | async">
          <a
            class="dropdown-item"
            [routerLink]="['/albums-list']"
            [queryParams]="{ band: albumService.encode('AC/DC') }"
            >AC/DC</a
          >
          <a
            class="dropdown-item"
            [routerLink]="['/albums-list']"
            [queryParams]="{ band: albumService.encode('Guns N Roses') }"
            >Guns N' Roses</a
          >
          <a
            class="dropdown-item"
            [routerLink]="['/albums-list']"
            [queryParams]="{ band: albumService.encode('Scorpions') }"
            >Scorpions</a
          >
        </div>
      </li>

      <!-- Metal bands -->
      <li
        class="nav-item dropdown"
        (mouseenter)="onMouseEnter('metal')"
        (mouseleave)="onMouseLeave('metal')"
        (click)="onClick('metal')"
        [class.show]="metalOpen$ | async"
      >
        <a
          class="nav-link dropdown-toggle"
          style="cursor: pointer"
          [attr.aria-expanded]="metalOpen$ | async"
        >
          Metal bands
        </a>

        <div class="dropdown-menu" [class.show]="metalOpen$ | async">
          <a
            class="dropdown-item"
            [routerLink]="['/albums-list']"
            [queryParams]="{ band: albumService.encode('Iron Maiden') }"
            >Iron Maiden</a
          >
          <a
            class="dropdown-item"
            [routerLink]="['/albums-list']"
            [queryParams]="{ band: albumService.encode('Judas Priest') }"
            >Judas Priest</a
          >
          <a
            class="dropdown-item"
            [routerLink]="['/albums-list']"
            [queryParams]="{ band: albumService.encode('Metallica') }"
            >Metallica</a
          >
        </div>
      </li>
    </ul>

    <ul class="navbar-nav ms-auto" style="margin-right: 100px">
      <app-login-status></app-login-status>
    </ul>
  </div>
</nav>
