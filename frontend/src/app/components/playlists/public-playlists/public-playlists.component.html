<div class="page">
  <h2>Playlists</h2>
  <p class="lead">Playlists shared by our listeners. Press play to hear 30-second previews.</p>

  @if (error()) {
    <p class="note error">{{ error() }}</p>
  } @else if (playlists() === null) {
    <p class="note">Loading...</p>
  } @else if (playlists()!.length === 0) {
    <p class="note">No public playlists yet.</p>
  } @else {
    <div class="grid">
      @for (pl of playlists(); track pl.id) {
        <app-playlist-card [playlist]="pl"></app-playlist-card>
      }
    </div>
  }
</div>
