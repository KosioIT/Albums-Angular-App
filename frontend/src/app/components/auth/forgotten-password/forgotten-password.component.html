<div class="col-md-6 col-lg-4 mx-auto mt-5">
  <div class="card shadow-sm form-container">
    <div class="card-body">
      <h5 class="card-title mb-4 text-center">Forgotten Password</h5>

      <p class="text-muted small text-center">
        Enter your account email and we will send you a 6-digit reset code.
      </p>

      <form [formGroup]="forgotForm" (ngSubmit)="onSendResetCode()">
        <div class="form-group mb-3">
          <label for="email">Email:</label>

          <input
            type="email"
            id="email"
            autocomplete="email"
            class="form-control"
            formControlName="email"
            (blur)="formHelperService.onBlur('email')"
          />

          <div
            class="validation-error text-danger mt-1"
            appValidationMessage="email"
          ></div>
        </div>

        <div class="d-flex justify-content-center">
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="forgotForm.invalid || submitting"
          >
            {{ submitting ? 'Sending...' : 'Send Reset Code' }}
          </button>
        </div>
      </form>

      <p class="text-center mt-4 mb-0">
        <a routerLink="/login">Back to sign in</a>
      </p>
    </div>
  </div>
</div>
