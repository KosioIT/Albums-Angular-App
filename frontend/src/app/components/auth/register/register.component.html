<div class="col-md-6 col-lg-4 mx-auto mt-5">
  <div class="card shadow-sm form-container" style="margin-top: 55px">
    <div class="card-body">
      <h5 class="card-title mb-4 text-center">Sign up</h5>

      <form [formGroup]="registerForm" (ngSubmit)="submitRegisterForm()">
        <!-- Username -->
        <div class="form-group mb-3">
          <label for="username">Username:</label>
          <input
            type="text"
            id="username"
            autocomplete="username"
            class="form-control"
            formControlName="username"
            (blur)="formHelperService.onBlur('username')"
          />

          <div
            class="validation-error text-danger mt-1"
            appValidationMessage="username"
          ></div>
        </div>

        <!-- Email -->
        <div class="form-group mb-3">
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            autocomplete="email"
            class="form-control"
            formControlName="email"
            (blur)="formHelperService.onBlur('email')"
          />

          <div
            class="validation-error text-danger mt-1"
            appValidationMessage="email"
          ></div>
        </div>

        <!-- Password -->
        <div class="form-group mb-3">
          <label for="password">Password:</label>
          <input
            type="password"
            id="password"
            autocomplete="new-password"
            class="form-control"
            formControlName="password"
            (blur)="formHelperService.onBlur('password')"
          />

          <div
            class="validation-error text-danger mt-1"
            appValidationMessage="password"
          ></div>
        </div>

        <!-- Submit -->
        <div
          class="d-flex justify-content-center align-items-center flex-column"
        >
          <button
            type="submit"
            class="btn btn-primary submit-btn"
            [disabled]="registerForm.invalid || submitting"
          >
            {{ submitting ? "Creating account..." : "Sign up" }}
          </button>

          <p class="acc-p w-100 text-center mt-4">
            Already have an account?
            <a class="ms-2 registerLink" routerLink="/login">Sign in</a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>
