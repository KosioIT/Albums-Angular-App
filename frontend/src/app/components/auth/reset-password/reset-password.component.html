<div class="col-md-6 col-lg-4 mx-auto mt-5">
  <div class="card shadow-sm form-container">
    <div class="card-body">
      <h5 class="card-title mb-4 text-center">Forgotten Password</h5>

      <form [formGroup]="resetPasswordForm" (ngSubmit)="onPasswordReset()">
        <div class="form-group mb-3">
          <label for="code">Reset Code:</label>

          <input
            type="number"
            id="code"
            class="form-control"
            formControlName="code"
            required
            (blur)="formHelperService.onBlur('code')"
          />

          <div
            class="validation-error text-danger mt-1"
            appValidationMessage="resetCode"
          ></div>
        </div>

        <div class="form-group mb-3">
          <label for="newPassword">New Password:</label>

          <input
            type="password"
            id="newPassword"
            class="form-control"
            formControlName="newPassword"
            required
            (blur)="formHelperService.onBlur('newPassword')"
          />

          <div
            class="validation-error text-danger mt-1"
            appValidationMessage="password"
          ></div>
        </div>

        <div class="d-flex justify-content-center">
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="resetPasswordForm.invalid"
          >
            Reset Password
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
