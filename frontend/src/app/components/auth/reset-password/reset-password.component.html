<div class="col-md-6 col-lg-4 mx-auto mt-5">
  <div class="card shadow-sm form-container">
    <div class="card-body">
      <h5 class="card-title mb-3 text-center">Reset Password</h5>

      <p class="text-muted small text-center">
        Enter the 6-digit code sent to <strong>{{ email }}</strong> and choose a new password.
      </p>

      <form [formGroup]="resetPasswordForm" (ngSubmit)="onPasswordReset()">
        <!-- Email for password managers; not editable here -->
        <input type="email" name="email" [value]="email" autocomplete="username" hidden />

        <div class="form-group mb-3">
          <label for="code">Reset Code:</label>

          <input
            type="text"
            id="code"
            class="form-control"
            formControlName="code"
            inputmode="numeric"
            autocomplete="one-time-code"
            placeholder="123456"
            (input)="onCodeInput()"
            (blur)="formHelperService.onBlur('code')"
          />

          <div class="validation-error text-danger mt-1" appValidationMessage="resetCode" controlName="code"></div>

          <div class="d-flex justify-content-end mt-1">
            <button
              type="button"
              class="btn btn-link btn-sm p-0"
              [disabled]="resendIn > 0"
              (click)="resendCode()"
            >
              {{ resendIn > 0 ? 'Send a new code in ' + resendIn + 's' : 'Send a new code' }}
            </button>
          </div>
        </div>

        <div class="form-group mb-3">
          <label for="newPassword">New Password:</label>

          <input
            type="password"
            id="newPassword"
            class="form-control"
            formControlName="newPassword"
            autocomplete="new-password"
            (blur)="formHelperService.onBlur('newPassword')"
          />

          <div class="validation-error text-danger mt-1" appValidationMessage="password" controlName="newPassword"></div>
        </div>

        <div class="d-flex justify-content-center">
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="resetPasswordForm.invalid || submitting"
          >
            {{ submitting ? 'Resetting...' : 'Reset Password' }}
          </button>
        </div>
      </form>

      <p class="text-center mt-4 mb-0">
        <a routerLink="/login">Back to sign in</a>
      </p>
    </div>
  </div>
</div>
