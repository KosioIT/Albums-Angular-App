<li
  class="nav-item dropdown"
  [class.show]="dropdownOpen$ | async"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
>
  <a
    class="nav-link d-flex align-items-center"
    style="cursor: pointer"
    (click)="onClick()"
    [attr.aria-expanded]="dropdownOpen$ | async"
  >
    <img
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRqgfsYn5co7FYXZi4-vGdJ2c4NZq7foww9L30axpxiKYymOSzUm4F9mDW1mZLCui-Dm7I&usqp=CAU"
      alt="User Icon"
      class="user-icon me-1"
    />

    @if (user) {
      <span>{{ user.username }}</span>
    }
  </a>

  <div
    class="dropdown-menu dropdown-menu-center"
    [class.show]="dropdownOpen$ | async"
  >
    @if (!user) {
      <a class="dropdown-item" routerLink="/login">Sign in</a>
      <a class="dropdown-item" routerLink="/register">Sign up</a>
    } @else {
      @if (authService.isAdmin()) {
        <ng-container
          *ngTemplateOutlet="submenu; context: { name: 'admin', label: 'Admin', items: adminItems }"
        ></ng-container>
      }
      <ng-container
        *ngTemplateOutlet="submenu; context: { name: 'music', label: 'My music', items: musicItems }"
      ></ng-container>
      <ng-container
        *ngTemplateOutlet="submenu; context: { name: 'account', label: 'Account', items: accountItems }"
      ></ng-container>

      <div class="dropdown-divider"></div>
      <a class="dropdown-item" role="button" (click)="logout()">Sign out</a>
    }
  </div>
</li>

<!-- A group with its own second-level menu -->
<ng-template #submenu let-name="name" let-label="label" let-items="items">
  <div
    class="submenu-wrap"
    [class.open]="openSubmenu === name"
    (mouseenter)="hoverSubmenu(name)"
    (mouseleave)="hoverSubmenu(null)"
  >
    <button
      type="button"
      class="dropdown-item submenu-toggle"
      aria-haspopup="true"
      [attr.aria-expanded]="openSubmenu === name"
      (click)="toggleSubmenu(name, $event)"
    >
      <span class="caret" aria-hidden="true"></span>{{ label }}
    </button>
    <div class="dropdown-menu submenu" [class.show]="openSubmenu === name">
      @for (item of items; track item.label) {
        @if (item.link) {
          <a class="dropdown-item" [routerLink]="item.link">{{ item.label }}</a>
        } @else {
          <a class="dropdown-item" role="button" (click)="item.action()">{{ item.label }}</a>
        }
      }
    </div>
  </div>
</ng-template>
