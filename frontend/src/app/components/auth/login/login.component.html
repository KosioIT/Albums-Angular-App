<div class="col-md-6 col-lg-4 mx-auto mt-5">
  <div class="card shadow-sm form-container">
    <div class="card-body">
      <h5 class="card-title mb-4 text-center">Sign in</h5>

      <form [formGroup]="loginForm" (ngSubmit)="submitLoginForm()">
        <!-- Email -->
        <div class="form-group mb-3">
          <label for="email">Email:</label>
          <input
            type="email"
            id="email"
            autocomplete="email"
            formControlName="email"
            class="form-control"
            (blur)="formHelperService.onBlur('email')"
          />

          <div
            class="validation-error text-danger mt-1"
            appValidationMessage="email"
          ></div>
        </div>

        <!-- Password -->
        <div class="form-group mb-3">
          <label for="password">Password:</label>
          <input
            type="password"
            id="password"
            autocomplete="current-password"
            formControlName="password"
            class="form-control"
            (blur)="formHelperService.onBlur('password')"
          />

          <div
            class="validation-error text-danger mt-1"
            appValidationMessage="password"
          ></div>

          <div id="forgottenPsw" class="d-flex justify-content-end mt-1">
            <a routerLink="/forgot-password">Forgotten password?</a>
          </div>
        </div>

        <!-- Submit -->
        <div class="text-center mt-3">
          <button
            class="btn btn-primary"
            type="submit"
            [disabled]="loginForm.invalid || submitting"
          >
            {{ submitting ? 'Signing in...' : 'Sign in' }}
          </button>
        </div>

        <!-- Register link -->
        <div
          class="d-flex justify-content-center align-items-center flex-column"
        >
          <p class="acc-p w-100 text-center mt-4">
            Don't have an account?
            <a class="ms-2 registerLink" routerLink="/register">Sign up</a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>
