# The Angular app plus the API behind one address, so the browser sees a single site
# (no CORS, and the refresh cookie stays first-party).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The API (the "api" service in docker-compose.yml)
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s; # the first download of an album packs its zip
    }

    # Files with a hash in the name (main-DGGHZU7D.js) never change: cache them for long
    location ~ "-[A-Z0-9]{8}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Every other path is a page of the app (/albums-list, /admin/users...)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
